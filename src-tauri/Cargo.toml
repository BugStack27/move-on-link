[package]
name = "moveonlink"
version = "0.0.1"
description = "Move folders to another disk and leave a link behind"
edition = "2021"
rust-version = "1.77"

[lib]
name = "moveonlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
junction = "2"
fs2 = "0.4"
sha2 = "0.10"
chrono = "0.4"
thiserror = "2"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem"
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
